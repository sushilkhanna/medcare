# ??? Server ???
server.port=${PORT:8080}

# ??? Database ???
# DATABASE_URL is set in Render dashboard (already jdbc:postgresql://... format).
# DatabaseConfig automatically normalizes postgresql:// to jdbc:postgresql:// if needed.
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/medcare_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ??? Connection Pool (HikariCP) ???
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ??? JPA / Hibernate ???
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ??? Static Resources ???
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=${STATIC_CACHE_SECONDS:0}
spring.mvc.static-path-pattern=/**

# ??? JWT ???
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ??? File Upload ???
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ??? CORS ???
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ??? Logging ???
logging.level.com.medcare=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# ??? AI Assistant ???
ai.api.url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:llama-3.1-8b-instant}