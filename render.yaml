databases:
  - name: medcare-db
    databaseName: medcare_db
    plan: free

services:
  - type: web
    name: medcare
    runtime: docker
    dockerfilePath: ./medcare/Dockerfile
    dockerContext: ./medcare
    plan: free
    envVars:
      - key: PORT
        value: 8080
      # ── Database ──
      # Render's connectionURI is postgresql://user:pass@host:port/db which is
      # NOT a valid JDBC URL. Spring expects jdbc:postgresql://host:port/db with
      # separate username/password. We build JDBC_DATABASE_URL from the
      # individual properties that Render exposes.
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: medcare-db
          property: connectionURI
      - key: DB_USERNAME
        fromDatabase:
          name: medcare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medcare-db
          property: password
      # ── JWT ──
      # Set a Base64-encoded string in Render dashboard.
      # Generate one with: openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      # ── CORS ──
      # Set to your Render URL in the dashboard, e.g.:
      # https://medcare-z17l.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DDL_AUTO
        value: update
      - key: AI_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: AI_API_KEY
        sync: false
      - key: AI_API_MODEL
        value: openai/gpt-oss-20b

